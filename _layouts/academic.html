<!doctype html>
<html lang="en"{% if site.site_theme == 'dark' %} data-theme="dark"{% endif %}>
  <head>
    {% include base_path %}
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% include seo.html %}
    <link rel="icon" type="image/png" href="{{ base_path }}/images/uwmadison.png">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }} Feed" href="{{ base_path }}/feed.xml">
    <script src="{{ base_path }}/assets/js/academic-theme.js"></script>
    <link rel="stylesheet" href="{{ base_path }}/assets/css/academic.css?v={{ site.time | date: '%s' }}">
    <link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css">
  </head>
  <body class="academic-site">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <nav class="site-container site-nav" aria-label="Main navigation">
        <a class="site-name" href="{{ base_path }}/"{% if page.url == '/' %} aria-current="page"{% endif %}>Zhuoming Liu<span class="brand-dot" aria-hidden="true">.</span></a>
        <div class="nav-links">
          <a href="{{ base_path }}/publications/"{% if page.url == '/publications/' %} aria-current="page"{% endif %}>Publications</a>
          <a href="{{ base_path }}/cv/"{% if page.url == '/cv/' %} aria-current="page"{% endif %}>CV</a>
          <button class="theme-toggle" type="button" aria-label="Dark mode" aria-pressed="false" hidden><i class="fa-solid fa-moon" aria-hidden="true"></i></button>
        </div>
      </nav>
    </header>
    <main id="main" class="site-container site-main" tabindex="-1">
      {{ content }}
    </main>
    <footer class="site-footer site-container">
      <p>&copy; {{ site.time | date: '%Y' }} Zhuoming Liu</p>
      <p>Built with <a href="https://jekyllrb.com/">Jekyll</a>. Based on <a href="https://github.com/academicpages/academicpages.github.io">AcademicPages</a> &amp; <a href="https://mademistakes.com/work/minimal-mistakes-jekyll-theme/">Minimal Mistakes</a>.</p>
    </footer>
    {% include analytics.html %}
  </body>
</html>
